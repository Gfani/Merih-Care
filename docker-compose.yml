version: '3.8'

services:
  # 1. Database Service
  postgres:
    image: postgres:15-alpine
    container_name: merihcare-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME:-merihcare_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-merihcare_secure_prod_password}
      POSTGRES_DB: ${DB_DATABASE:-merihcare_db}
    # Do not expose ports publicly in production
    networks:
      - backend-net
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-merihcare_user} -d ${DB_DATABASE:-merihcare_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Cache Service
  redis:
    image: redis:7-alpine
    container_name: merihcare-redis
    restart: always
    # Enable Redis authentication
    command: redis-server --requirepass ${REDIS_PASSWORD:-merihcare_redis_secure_password}
    # Do not expose ports publicly in production
    networks:
      - backend-net
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-merihcare_redis_secure_password} ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Object Storage (MinIO)
  minio:
    image: minio/minio:RELEASE.2023-08-29T23-07-35Z
    container_name: merihcare-minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minio_root_user}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minio_root_secure_password}
    command: server /data --console-address ":9001"
    networks:
      - backend-net
      - frontend-net
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 4. Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: merihcare-backend
    restart: always
    env_file:
      - .env.production
    networks:
      - frontend-net
      - backend-net
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 5. Queue Worker Service
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: merihcare-worker
    restart: always
    command: npm run start:prod
    env_file:
      - .env.production
    networks:
      - backend-net
    depends_on:
      backend:
        condition: service_healthy

  # 6. Admin Web Assets Builder
  admin-web:
    build:
      context: ./admin-web
      dockerfile: Dockerfile
    container_name: merihcare-admin-web
    # Temporary container to copy built static files to shared volume
    volumes:
      - admin_assets:/usr/share/nginx/html

  # 7. Reverse Proxy & TLS (Nginx Entrypoint)
  nginx:
    image: nginx:1.25-alpine
    container_name: merihcare-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - admin_assets:/usr/share/nginx/html:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - frontend-net
    depends_on:
      backend:
        condition: service_healthy

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  uploads_data:
  admin_assets:
  certs_data:
