name: merihcare
description: "Merihcare - Premium Home Healthcare Services"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Routing
  go_router: ^14.0.0

  # HTTP client
  dio: ^5.4.0

  # State management
  flutter_riverpod: ^2.5.1

  # Secure storage
  flutter_secure_storage: ^9.0.0

  # JSON serialization runtime
  json_annotation: ^4.9.0

  # Offline connectivity detection
  connectivity_plus: ^6.0.0

  # Internationalization
  intl: ^0.20.2

  # WebSocket client
  web_socket_channel: ^3.0.0
  socket_io_client: ^3.0.1

  # Push notifications & crash reporting
  firebase_core: ^2.27.0
  firebase_messaging: ^14.8.0
  firebase_crashlytics: ^3.4.0
  flutter_local_notifications: ^17.0.0

  # Maps
  google_maps_flutter: ^2.5.3

  # Image/file picker
  image_picker: ^1.0.7
  file_picker: ^8.0.0

  # Common UI/Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
