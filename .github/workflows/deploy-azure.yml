name: Deploy to Microsoft Azure

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  AZURE_RESOURCE_GROUP: rg-merihcare-uae
  CONTAINER_APP_NAME: app-merihcare-prod-backend
  ADMIN_CONTAINER_APP_NAME: app-merihcare-prod-admin

jobs:
  deploy-backend:
    name: Deploy Backend to Azure Container Apps
    runs-on: ubuntu-latest
    if: "${{ secrets.AZURE_CREDENTIALS != '' && secrets.ACR_NAME != '' }}"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sanitize Azure Credentials
        id: sanitize-creds
        env:
          RAW_CREDS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          node -e '
            let str = (process.env.RAW_CREDS || "").trim();
            if (!str) {
              console.log("::notice::The secret AZURE_CREDENTIALS is empty or not set in GitHub Secrets. Skipping deployment.");
              process.exit(0);
            }
            if (!str.startsWith("{")) {
              const braceIdx = str.indexOf("{");
              if (braceIdx !== -1) {
                str = str.substring(braceIdx);
              } else {
                str = "{\n" + str;
              }
            }
            const lastBrace = str.lastIndexOf("}");
            if (lastBrace !== -1) {
              str = str.substring(0, lastBrace + 1);
            } else {
              str = str + "\n}";
            }
            try {
              JSON.parse(str);
            } catch (err) {
              console.error("::error::AZURE_CREDENTIALS is not valid JSON: " + err.message);
              process.exit(1);
            }
            const fs = require("fs");
            fs.writeFileSync(process.env.GITHUB_ENV, `CLEANED_AZURE_CREDENTIALS<<EOF\n${str}\nEOF\n`, { flag: "a" });
          '

      - name: Azure Login
        if: env.CLEANED_AZURE_CREDENTIALS != ''
        uses: azure/login@v2
        with:
          creds: ${{ env.CLEANED_AZURE_CREDENTIALS }}

      - name: Set up Docker Buildx
        if: env.CLEANED_AZURE_CREDENTIALS != ''
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry (ACR)
        if: env.CLEANED_AZURE_CREDENTIALS != ''
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build and Push Backend Image
        if: env.CLEANED_AZURE_CREDENTIALS != ''
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/merihcare-backend:${{ github.sha }},${{ secrets.ACR_LOGIN_SERVER }}/merihcare-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy Image to Azure Container Apps
        if: env.CLEANED_AZURE_CREDENTIALS != ''
        uses: azure/container-apps-deploy-action@v1
        with:
          acrName: ${{ secrets.ACR_NAME }}
          containerAppName: ${{ env.CONTAINER_APP_NAME }}
          resourceGroup: ${{ env.AZURE_RESOURCE_GROUP }}
          imageToDeploy: ${{ secrets.ACR_LOGIN_SERVER }}/merihcare-backend:${{ github.sha }}

  deploy-admin-web:
    name: Deploy Admin Web to Azure Container Apps
    runs-on: ubuntu-latest
    if: "${{ secrets.AZURE_CREDENTIALS != '' && secrets.ACR_NAME != '' }}"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sanitize Azure Credentials
        id: sanitize-creds-admin
        env:
          RAW_CREDS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          node -e '
            let str = (process.env.RAW_CREDS || "").trim();
            if (!str) {
              console.log("::notice::The secret AZURE_CREDENTIALS is empty or not set in GitHub Secrets. Skipping deployment.");
              process.exit(0);
            }
            if (!str.startsWith("{")) {
              const braceIdx = str.indexOf("{");
              if (braceIdx !== -1) {
                str = str.substring(braceIdx);
              } else {
                str = "{\n" + str;
              }
            }
            const lastBrace = str.lastIndexOf("}");
            if (lastBrace !== -1) {
              str = str.substring(0, lastBrace + 1);
            } else {
              str = str + "\n}";
            }
            try {
              JSON.parse(str);
            } catch (err) {
              console.error("::error::AZURE_CREDENTIALS is not valid JSON: " + err.message);
              process.exit(1);
            }
            const fs = require("fs");
            fs.writeFileSync(process.env.GITHUB_ENV, `CLEANED_AZURE_CREDENTIALS<<EOF\n${str}\nEOF\n`, { flag: "a" });
          '

      - name: Azure Login
        if: env.CLEANED_AZURE_CREDENTIALS != ''
        uses: azure/login@v2
        with:
          creds: ${{ env.CLEANED_AZURE_CREDENTIALS }}

      - name: Set up Docker Buildx
        if: env.CLEANED_AZURE_CREDENTIALS != ''
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry (ACR)
        if: env.CLEANED_AZURE_CREDENTIALS != ''
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build and Push Admin Web Image
        if: env.CLEANED_AZURE_CREDENTIALS != ''
        uses: docker/build-push-action@v5
        with:
          context: ./admin-web
          file: ./admin-web/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=https://api.merihcare.live/api/v1
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/merihcare-admin-web:${{ github.sha }},${{ secrets.ACR_LOGIN_SERVER }}/merihcare-admin-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy Admin Web Image to Azure Container Apps
        if: env.CLEANED_AZURE_CREDENTIALS != ''
        uses: azure/container-apps-deploy-action@v1
        with:
          acrName: ${{ secrets.ACR_NAME }}
          containerAppName: ${{ env.ADMIN_CONTAINER_APP_NAME }}
          resourceGroup: ${{ env.AZURE_RESOURCE_GROUP }}
          imageToDeploy: ${{ secrets.ACR_LOGIN_SERVER }}/merihcare-admin-web:${{ github.sha }}
