name: Deploy to Microsoft Azure

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  AZURE_RESOURCE_GROUP: rg-merihcare-uae
  CONTAINER_APP_NAME: app-merihcare-prod-backend
  ADMIN_CONTAINER_APP_NAME: app-merihcare-prod-admin

jobs:
  deploy-backend:
    name: Deploy Backend to Azure Container Apps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sanitize Azure Credentials
        id: sanitize-creds
        env:
          RAW_CREDS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          node -e '
            let str = (process.env.RAW_CREDS || "").trim();
            if (!str) {
              console.error("::error::The secret AZURE_CREDENTIALS is not set in GitHub Secrets. Please configure AZURE_CREDENTIALS before deploying.");
              process.exit(1);
            }
            if (!str.startsWith("{")) {
              const braceIdx = str.indexOf("{");
              if (braceIdx !== -1) {
                str = str.substring(braceIdx);
              } else {
                str = "{\n" + str;
              }
            }
            const lastBrace = str.lastIndexOf("}");
            if (lastBrace !== -1) {
              str = str.substring(0, lastBrace + 1);
            } else {
              str = str + "\n}";
            }
            try {
              JSON.parse(str);
            } catch (err) {
              console.error("::error::AZURE_CREDENTIALS is not valid JSON: " + err.message);
              process.exit(1);
            }
            const fs = require("fs");
            fs.writeFileSync(process.env.GITHUB_ENV, `CLEANED_AZURE_CREDENTIALS<<EOF\n${str}\nEOF\n`, { flag: "a" });
          '

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ env.CLEANED_AZURE_CREDENTIALS }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry (ACR)
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/merihcare-backend:${{ github.sha }},${{ secrets.ACR_LOGIN_SERVER }}/merihcare-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy Image to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          acrName: ${{ secrets.ACR_NAME }}
          containerAppName: ${{ env.CONTAINER_APP_NAME }}
          resourceGroup: ${{ env.AZURE_RESOURCE_GROUP }}
          imageToDeploy: ${{ secrets.ACR_LOGIN_SERVER }}/merihcare-backend:${{ github.sha }}

      - name: Route 100% Traffic to Latest Backend Revision
        uses: azure/cli@v2
        with:
          inlineScript: |
            az config set extension.use_dynamic_install=yes_without_prompt
            az extension add --name containerapp --upgrade || true
            echo "Updating backend container image to ${{ secrets.ACR_LOGIN_SERVER }}/merihcare-backend:${{ github.sha }}..."
            az containerapp update \
              --name ${{ env.CONTAINER_APP_NAME }} \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --image ${{ secrets.ACR_LOGIN_SERVER }}/merihcare-backend:${{ github.sha }}
            sleep 15
            az containerapp ingress traffic set \
              --name ${{ env.CONTAINER_APP_NAME }} \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --revision-weight latest=100 || true
            mkdir -p azure_diag
            az containerapp show --name ${{ env.CONTAINER_APP_NAME }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }} -o json > azure_diag/backend_app.json
            az containerapp revision list --name ${{ env.CONTAINER_APP_NAME }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }} -o json > azure_diag/backend_revisions.json
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B azure-diag
            git add -f azure_diag
            git commit -m "chore(azure): live diagnostics"
            git push -f origin azure-diag || true

  deploy-admin-web:
    name: Deploy Admin Web to Azure Container Apps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sanitize Azure Credentials
        id: sanitize-creds-admin
        env:
          RAW_CREDS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          node -e '
            let str = (process.env.RAW_CREDS || "").trim();
            if (!str) {
              console.error("::error::The secret AZURE_CREDENTIALS is not set in GitHub Secrets. Please configure AZURE_CREDENTIALS before deploying.");
              process.exit(1);
            }
            if (!str.startsWith("{")) {
              const braceIdx = str.indexOf("{");
              if (braceIdx !== -1) {
                str = str.substring(braceIdx);
              } else {
                str = "{\n" + str;
              }
            }
            const lastBrace = str.lastIndexOf("}");
            if (lastBrace !== -1) {
              str = str.substring(0, lastBrace + 1);
            } else {
              str = str + "\n}";
            }
            try {
              JSON.parse(str);
            } catch (err) {
              console.error("::error::AZURE_CREDENTIALS is not valid JSON: " + err.message);
              process.exit(1);
            }
            const fs = require("fs");
            fs.writeFileSync(process.env.GITHUB_ENV, `CLEANED_AZURE_CREDENTIALS<<EOF\n${str}\nEOF\n`, { flag: "a" });
          '

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ env.CLEANED_AZURE_CREDENTIALS }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry (ACR)
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build and Push Admin Web Image
        uses: docker/build-push-action@v5
        with:
          context: ./admin-web
          file: ./admin-web/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=https://api.merihcare.live/api/v1
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/merihcare-admin-web:${{ github.sha }},${{ secrets.ACR_LOGIN_SERVER }}/merihcare-admin-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy Admin Web Image to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          acrName: ${{ secrets.ACR_NAME }}
          containerAppName: ${{ env.ADMIN_CONTAINER_APP_NAME }}
          resourceGroup: ${{ env.AZURE_RESOURCE_GROUP }}
          imageToDeploy: ${{ secrets.ACR_LOGIN_SERVER }}/merihcare-admin-web:${{ github.sha }}

      - name: Route 100% Traffic to Latest Admin Web Revision
        uses: azure/cli@v2
        with:
          inlineScript: |
            az config set extension.use_dynamic_install=yes_without_prompt
            az extension add --name containerapp --upgrade || true
            echo "Updating admin web container image to ${{ secrets.ACR_LOGIN_SERVER }}/merihcare-admin-web:${{ github.sha }}..."
            az containerapp update \
              --name ${{ env.ADMIN_CONTAINER_APP_NAME }} \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --image ${{ secrets.ACR_LOGIN_SERVER }}/merihcare-admin-web:${{ github.sha }}
            sleep 15
            az containerapp ingress traffic set \
              --name ${{ env.ADMIN_CONTAINER_APP_NAME }} \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --revision-weight latest=100 || true
            echo "### Admin Web Revisions" >> $GITHUB_STEP_SUMMARY
            az containerapp revision list \
              --name ${{ env.ADMIN_CONTAINER_APP_NAME }} \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              -o table >> $GITHUB_STEP_SUMMARY

