name: Merihcare CI/CD Pipeline

on:
  push:
    branches: [ main, staging, develop ]
  pull_request:
    branches: [ main, staging ]

jobs:
  backend-test:
    name: Backend Test, Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        working-directory: backend
        run: npm ci

      - name: Run Backend Tests
        working-directory: backend
        run: npm test -- --passWithNoTests

      - name: Verify Database Migrations Syntax
        working-directory: backend
        run: npm run typeorm -- --help

      - name: Build Application
        working-directory: backend
        run: npm run build

  admin-web-test:
    name: Admin Web Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: admin-web/package-lock.json

      - name: Install Dependencies
        working-directory: admin-web
        run: npm ci

      - name: Run Unit Tests
        working-directory: admin-web
        run: npm test -- --passWithNoTests

      - name: Build Web Application
        working-directory: admin-web
        run: npm run build

  mobile-test:
    name: Flutter Mobile Test & Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Mobile Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Generate Localizations
        working-directory: mobile
        run: flutter gen-l10n

      - name: Run Static Analysis
        working-directory: mobile
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run Mobile Unit Tests
        working-directory: mobile
        run: flutter test

  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Backend Docker Image
        working-directory: backend
        run: docker build -t merihcare-backend:latest .

      - name: Build Admin Web Docker Image
        working-directory: admin-web
        run: docker build -t merihcare-admin-web:latest .

  deploy:
    name: Continuous Deployment
    needs: [backend-test, admin-web-test, mobile-test, docker-build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Database Migrations in Deployment
        run: |
          echo "[DEPLOY] Running TypeORM migrations prior to booting updated services..."
          # docker compose run --rm migration || npm run migration:run

      - name: Deploy to Production
        run: echo "Production Deployment Triggered for commit ${{ github.sha }}"
