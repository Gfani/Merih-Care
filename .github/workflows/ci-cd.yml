name: Merihcare CI — Test, Lint & Build Verification

on:
  push:
    branches: [ main, staging, develop ]
  pull_request:
    branches: [ main, staging ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  backend-ci:
    name: 🔧 Backend — Test, Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present || true

      - name: Unit tests
        run: npm test -- --passWithNoTests
        env:
          NODE_ENV: test
          DATABASE_URL: sqlite:///:memory:
          JWT_SECRET: ci-test-secret
          OWNER_EMAIL: fanuelgoitom79@gmail.com

      - name: Build (TypeScript compile)
        run: npm run build

      - name: TypeORM CLI smoke test
        run: npm run typeorm -- --help

  # ────────────────────────────────────────────────────────────────────────────
  admin-web-ci:
    name: 🌐 Admin Web — Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test -- --passWithNoTests

      - name: Production build
        run: npm run build
        env:
          VITE_API_URL: https://api.merihcare.live/api/v1

      - name: Upload admin-web dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-web-dist
          path: admin-web/dist/
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────────────
  mobile-ci:
    name: 📱 Flutter — Analyze, Test & Build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Unit tests (no device required)
        run: flutter test --no-pub

      # ── Release signing setup (only when secrets are available) ──────────
      - name: Decode & write keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/merihcare-release.jks

      - name: Write key.properties
        if: ${{ env.KEY_ALIAS != '' }}
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=merihcare-release.jks
          EOF

      # ── APK build ─────────────────────────────────────────────────────────
      - name: Build release APK
        run: flutter build apk --release --split-per-abi
        env:
          FLUTTER_BUILD_NAME: ${{ github.run_number }}

      - name: Build release App Bundle (AAB)
        run: flutter build appbundle --release
        env:
          FLUTTER_BUILD_NAME: ${{ github.run_number }}

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: merihcare-apk-${{ github.sha }}
          path: |
            mobile/build/app/outputs/flutter-apk/*.apk
            mobile/build/app/outputs/bundle/release/*.aab
          retention-days: 30

  # ────────────────────────────────────────────────────────────────────────────
  docker-verify:
    name: 🐳 Docker Build Verification
    runs-on: ubuntu-latest
    # Only verify Docker builds on PRs/non-main branches; production build is
    # handled by deploy-azure.yml which uses layer caching for speed.
    if: github.ref != 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build admin-web image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./admin-web
          file: ./admin-web/Dockerfile
          push: false
          build-args: VITE_API_URL=https://api.merihcare.live/api/v1
          cache-from: type=gha
          cache-to: type=gha,mode=max
