name: Merihcare CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # 1. Backend Linting, Testing, and Build verification
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        working-directory: backend
        run: npm ci

      - name: Run Tests
        working-directory: backend
        run: npm test -- --passWithNoTests

      - name: Build Application
        working-directory: backend
        run: npm run build

  # 2. Admin Web Linting, Testing, and Build verification
  admin-web-ci:
    name: Admin Web CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: admin-web/package-lock.json

      - name: Install Dependencies
        working-directory: admin-web
        run: npm ci

      - name: Run Unit Tests
        working-directory: admin-web
        run: npm test -- --passWithNoTests

      - name: Build Application
        working-directory: admin-web
        run: npm run build

  # 3. Flutter Mobile App static analysis and testing
  mobile-ci:
    name: Mobile Client CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Generate Localizations
        working-directory: mobile
        run: flutter gen-l10n

      - name: Run Static Analysis
        working-directory: mobile
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run Mobile Unit/Widget Tests
        working-directory: mobile
        run: flutter test


  # 4. Docker Build Verification
  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Backend Docker Image
        working-directory: backend
        run: docker build -t merihcare-backend:latest .

      - name: Build Admin Web Docker Image
        working-directory: admin-web
        run: docker build -t merihcare-admin-web:latest .
